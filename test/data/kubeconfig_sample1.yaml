apiVersion: v1
kind: Config
clusters:
  - name: minikube
    cluster:
      certificate-authority: ca.crt
      server: https://127.0.0.1:6443
users:
  - name: minikube
    user:
      client-certificate: admin.crt
      client-key: admin.key
contexts:
  - name: minikube
    context:
      cluster: minikube
      user: minikube
current-context: minikube
